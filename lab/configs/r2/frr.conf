frr version 10.2
frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
exit
!
interface eth1
 description to-r1
 ip address 10.0.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to-r3
 ip address 10.0.23.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 50 100 500
exit
!
