frr version 10.2
frr defaults traditional
hostname r1
log stdout
! Log destinations are NOT set here. ospfd rejects a runtime `log file` for any
! path, so the per-daemon log files are set as startup flags in configs/daemons
! instead - see the comment there. Layer 0 tails those files.
!
! ZEBRA_INTERFACE_UP / ZEBRA_INTERFACE_DOWN are emitted at debug level only.
! Measured cost in this lab: zero lines in 30s of steady state - the volume is
! entirely burst-driven by topology changes.
debug zebra events
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
interface eth1
 description to-pc1
 ip address 10.0.1.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to-r2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 50 100 500
 ! Without this, adjacency changes are never logged and a link failure leaves
 ! no trace in the log at all.
 log-adjacency-changes detail
exit
!
